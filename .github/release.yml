changelog:
  exclude:
    labels:
      - dependencies
      - skip-changelog
  categories:
    - title: "Major reworks"
      labels:
        - major
    - title: "Minor updates"
      labels:
        - enhancement
        - minor
    - title: "Bug fixes"
      labels:
        - bug
        - fix
    - title: "Documentation"
      labels:
        - documentation
    - title: "Other changes"
      labels:
        - "*"

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
template: |
  ## Versioning

  Keep the major version at `1`. Use:

  - Patch releases: bump by `0.0.1` (for example, `1.0.0` to `1.0.1`).
  - Major reworks: bump by `0.1.0` (for example, `1.0.0` to `1.1.0`).

  Do not create a `2.0.0` release or otherwise increase the major version above `1`.
